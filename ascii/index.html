<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Gods · 异步计算舱 ASCII</title>
<style>
  html,body{margin:0;height:100%;background:#04070a;color:#c9d6d2;font:14px/1.4 'DejaVu Sans Mono',Consolas,monospace;overflow:hidden}
  #stage{display:block;width:100%;height:100%;image-rendering:pixelated}
  #gate,#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;background:rgba(4,7,10,.74);cursor:pointer;text-align:center;z-index:5}
  #loading{background:#04070a;cursor:default}
  #gate h1{font-weight:400;font-size:20px;margin:0;letter-spacing:.12em;color:#8fe9df}
  #gate p{color:#6f8a86;max-width:44ch}
  #err{position:fixed;left:8px;bottom:4px;color:#ff5c54;font-size:12px;z-index:9}
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="loading">装载 pack.json 与仿真…</div>
  <div id="gate" style="display:none">
    <h1>RANDOM GODS — 迭代器核心 / 多重异步时钟 CPU</h1>
    <p>点击进入播放。←/→ 跳 2s，空格 暂停/继续。<br>
       无音频环境：地址栏加 <code>?auto=1&t=125</code> 直接看单帧。</p>
  </div>
  <div id="err"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
